services:
  postgres:
    container_name: postgres
    image: postgres:18.3
    healthcheck:
      test: ['CMD', 'pg_isready -U postgres']
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tracker
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    container_name: redis
    image: redis:8.6.2
    healthcheck:
      test: ['CMD', 'redis-cli ping']
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
